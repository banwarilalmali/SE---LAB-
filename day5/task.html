<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #fff;
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            display: flex;
            flex: 1 1 320px;
            border: 1px solid #ddd;
        }

        .card-img {
            width: 140px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-img img {
            width: 100px;
        }

        .card-info {
            padding: 16px;
        }

        .title {
            font-size: 18px;
            margin: 0 0 8px;
        }

        .rating {
            font-size: 13px;
            color: #333;
        }

        .stars {
            color: #f08804;
        }

        .price {
            font-size: 24px;
            margin: 8px 0;
        }

        .delivery {
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="row">

        <div class="card">

            <div class="card-img">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUMFRZRkkns4M2jmjGxOZprax3knZairil1EpOf9zysw&s=10" alt="iPhone 18 Pro">

            </div>

            <div class="card-info">

                <h3 class="title">iPhone 18 Pro (1 TB) - Burgundy | 15.93 cm</h3>
                <div class="rating">3.8 <span class="stars">★★★★☆</span> (20)</div>
                <div class="price">₹2,39,900</div>
                <div class="delivery">FREE delivery <b>Fri, 9 Oct</b></div>

            </div>

        </div>

        <div class="card">

            <div class="card-img">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUMFRZRkkns4M2jmjGxOZprax3knZairil1EpOf9zysw&s=10" alt="iPhone 18 Pro">

            </div>

            <div class="card-info">

                <h3 class="title">iPhone 18 Pro (1 TB) - Black | 15.93 cm (6.3")</h3>
                <div class="rating">3.8 <span class="stars">★★★★☆</span> (20)</div>
                <div class="price">₹2,39,900</div>
                <div class="delivery">FREE delivery <b>Fri, 9 Oct</b></div>
                
            </div>

        </div>

        <div class="card">

            <div class="card-img">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUMFRZRkkns4M2jmjGxOZprax3knZairil1EpOf9zysw&s=10" alt="iPhone 18 Pro">

            </div>

            <div class="card-info">

                <h3 class="title">iPhone 18 Pro (512 GB) - Burgundy | 15.93 cm</h3>
                <div class="rating">3.8 <span class="stars">★★★★☆</span> (20)</div>
                <div class="price">₹1,89,900</div>
                <div class="delivery">FREE delivery <b>Sat, 10 Oct</b></div>

            </div>

        </div>

    </div>

</body>

</html>
