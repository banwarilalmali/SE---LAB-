<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table.com</title>

    <style>

        body
        {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: azure;
        }

        table
        {
            border: solid;
            border-radius: 10px;
            border-collapse: collapse;
        }

        th
        {
            padding: 10px;
            background-color: rgb(63, 159, 95);
            border: 2px solid black;
        }

        td
        {
            padding: 10px;
            background-color: rgb(241, 224, 191);
            color: rgb(62, 39, 115);
            border: 2px solid black;
        }


    </style>

</head>

<body>

    <h1>HTML TABLE</h1>

    <table border = "1">

        <!-- 1st row -->

        <tr>

            <th>PRODUCT</th>
            <th>CATEGORY</th>
            <th>PRICE</th>

        </tr>

        <!-- 2nd row -->

        <tr>

            <td>Laptop</td>
            <td>Electronics</td>
            <td>$800</td>

        </tr>

        <!-- 3rd row -->

        <tr>

            <td>Bookself</td>
            <td>Furniture</td>
            <td>$50</td>

        </tr>

        <!-- 4th row -->

        <tr>

            <td>Mixer</td>
            <td>Appliance</td>
            <td>$150</td>

        </tr>

    </table>
    
</body>

</html>
